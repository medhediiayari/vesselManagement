# Site nginx de l'application AMC (serveur partagé) — installé par server-setup.sh dans
# /etc/nginx/sites-available/amc, puis complété par certbot (HTTPS + redirection) et HTTP/2.
# __DOMAIN__ et __WEB_PORT__ sont remplacés à l'installation.

# « Connection: upgrade » seulement pour les WebSockets : les requêtes ordinaires gardent la connexion
# vers l'application ouverte (keep-alive). Nom de variable propre au site pour ne pas heurter les autres sites.
map $http_upgrade $amc_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream amc_web {
    server 127.0.0.1:__WEB_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Dépôts de fichiers jusqu'à 50 Mo (limite de l'API) + marge
    client_max_body_size 60m;

    # Fichiers statiques Next.js (noms versionnés) : cache navigateur long
    location /_next/static/ {
        proxy_pass http://amc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://amc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $amc_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
