# AMC Platform — production (un seul serveur)
# Usage (sur le serveur, dans /opt/amc) : deploy/first-deploy.sh puis deploy/update.sh (voir deploy/README.md)
# Exposition : nginx existant (domaine, certbot) → web sur 127.0.0.1:WEB_PORT, ou Caddy (profil « caddy »).
# Base, MinIO, Redis et API restent sur le réseau interne.
name: amc

x-db-url: &db-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_FILES: amc-files
      S3_BUCKET_QUARANTINE: amc-quarantine
      S3_BUCKET_EXPORTS: amc-exports
    volumes:
      - ../infra/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: amc-api:prod
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: *db-url
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    restart: "no"

  api:
    image: amc-api:prod
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: *db-url
      WEB_ORIGIN: https://${DOMAIN}
      APP_BASE_URL: https://${DOMAIN}
      COOKIE_SECURE: "true"
      SWAGGER_ENABLED: "false"
      S3_ENDPOINT: http://minio:9000
      # Fichiers servis par l'API (mode proxy) : MinIO n'est jamais exposé sur Internet
      S3_PUBLIC_ENDPOINT: https://${DOMAIN}
      FILE_DELIVERY_MODE: proxy
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_FILES: amc-files
      S3_BUCKET_QUARANTINE: amc-quarantine
      S3_BUCKET_EXPORTS: amc-exports
      AV_MODE: disabled
      REDIS_URL: redis://redis:6379
      EMAIL_MODE: ${EMAIL_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-AMC Platform <no-reply@amc.local>}
      LOG_LEVEL: info

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: http://api:4000 }
    image: amc-web:prod
    restart: unless-stopped
    depends_on: [api]
    # Publié sur la boucle locale seulement : relayé par nginx (serveur partagé) ou par Caddy
    ports:
      - "127.0.0.1:${WEB_PORT:-8095}:3100"

  # HTTPS autonome, seulement si aucun serveur web n'occupe déjà le serveur (COMPOSE_PROFILES=caddy dans .env.prod)
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN}
      TLS: ${TLS}
    # Serveur partagé (nginx déjà sur 80/443) : server-setup.sh choisit un port HTTPS libre (ex. 8443)
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  minio:
  redis:
  caddy_data:
  caddy_config:
